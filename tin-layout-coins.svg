	<rect x="0" y="0" width="706" height="948" fill="var(--bg)" />
	<text class="h1" x="30" y="34">Final packing &#8212; 3 coins, counters, 2 status dice each</text>
	<text class="sub" x="30" y="54">RookRobot 4&#215; condition d6 (16 mm) split two per tin &#183; interior 115.71 &#215; 68.07 &#215; 20.03 mm</text>
	<text class="sub" x="30" y="70">Fox drops one ten-column to make room for the second die. Yours keeps all 11.</text>
	<text class="h2" x="30" y="104">Fox's tin &#8212; Western &#216;34 (3 = 6.6 mm) &#183; 10 columns &#183; 2 status dice</text>
