# Hand-written callouts for the damage calculator, calc.html.
#
# The calculator reads card text and works out for itself what a card does to
# the math: Mist Energy stops Chaotic Pain, Crustle stops the ex attackers,
# Hero's Cape adds 100 HP. What the text can't say is what to do about it, and
# that is what lives here. Every note was seeded from dark-lucky.md's Cards to
# Watch Out For, which stays the reasoning; a note here is the one line to read
# before a match, with a link back to the section that explains it.
#
# [[note]]
#   cards      exact names, spelled the way the legal pool spells them. A
#              Pokémon's note shows when it is picked; a Tool, Stadium, or
#              Special Energy note shows when it is attached or in play.
#   abilities  Ability names. The note shows on any Pokémon that has one.
#              Safer than a card name when only some prints of a name carry
#              the Ability, which is true of Banette, Sylveon, and Crustle.
#   attacks    attack names, the same way
#   tone       "bad" for red, "good" for green
#   text       the line. *Asterisks* make italics, for attack and Ability
#              names, the same as the deck pages.
#   link       an anchor on dark-lucky.html, optional
#
# A name the pool doesn't have prints a warning and that part of the note is
# skipped, so a rotation never breaks the build. Read the warning anyway; it
# usually means the card has left Standard.
#
# A note says what to do, never what lands or what kills. A note can't see the
# board: "Pain still lands" on Crustle was true until a Mist Energy went on it,
# and then the page said it right beside the table saying it didn't. The
# calculator works out what gets through and what Knocks Out, live. A note that
# only repeats one of those numbers is noise, and a note that asserts one is a
# contradiction waiting for the right Energy.

