name: publish

# Publishes whatever is committed on main -- no generators run here, the HTML
# is built locally and committed. workflow_dispatch stays so any ref can still
# be published by hand.
on:
  push:
    branches:
      - main
  workflow_dispatch:
  # add-card.yml calls this directly. A push made by a workflow using the
  # built-in token does not start another workflow, so without this the card
  # would land on main and the site would sit there showing the old build.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but let a queued one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: stage site
        run: |
          mkdir -p _site
          # every page in the repo root is generated and meant to be published.
          # naming them one by one meant a new deck page was live locally and a
          # 404 in production until someone remembered to edit this line.
          cp *.html _site/
          cp -R assets _site/assets

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
