name: add a card

# The form on the Actions tab. Fill it in, and this looks the card up on
# TCGplayer, pulls its text and scan, rebuilds every page, commits, and
# republishes the site. Tick "need" and the card lands on the pull list; the
# same form with "need" ticked on a card already in the seed flips it there.
#
# Adding a card by hand is still fine, and is the same three commands this
# runs: add_cards.py, then normalize_cards.py, then build.py.
on:
  workflow_dispatch:
    inputs:
      card:
        description: "Card name and set, or a TCGplayer product URL"
        required: true
        type: string
      number:
        description: "Printed number, e.g. 060/131. Pins which printing when a name has more than one."
        required: false
        type: string
      need:
        description: "We do not own it yet: put it on the pull list."
        required: false
        default: false
        type: boolean
      japanese:
        description: "A Japanese card: search the Japanese product line."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# One at a time. Two runs at once would both branch off the same commit and the
# second push would be rejected.
concurrency:
  group: add-card
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Every input is passed through env, never interpolated into the script.
      # A ${{ }} in a run: block is pasted in as shell source before the shell
      # ever sees it, so a card name holding a quote would run as a command.
      - name: look the card up
        env:
          CARD: ${{ inputs.card }}
          NUMBER: ${{ inputs.number }}
          NEED: ${{ inputs.need }}
          JAPANESE: ${{ inputs.japanese }}
        run: |
          flags=()
          [ "$NEED" = "true" ] && flags+=(--need)
          [ "$JAPANESE" = "true" ] && flags+=(--japanese)
          python3 add_cards.py "$CARD" --number "$NUMBER" "${flags[@]}"

      - name: fetch its text and scan
        run: python3 normalize_cards.py

      - name: rebuild the site
        run: python3 build.py

      # Named paths, not "git add -A": the robot commits only what this run
      # produces, so nothing stray on the runner can ride along.
      - name: commit
        env:
          CARD: ${{ inputs.card }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add product-ids.tsv cards.csv collection.md ./*.html
          git add assets/*.jpg || true
          if git diff --cached --quiet; then
            echo "nothing changed; the card was already in the seed"
            exit 0
          fi
          git commit -m "add $CARD"
          git push

  publish:
    needs: add
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
