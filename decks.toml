# Every page on the site, in the order the front page lists them.
#
# This file is the one place a page is registered. build_deck_html.py builds
# what it lists, build_index.py links it, and build_wishlist.py reads its deck
# lists for the pull list. A markdown file that is not in here is a planning
# doc: the build leaves it alone and says so.
#
# [[library]]   a page that is not a deck. The front page lists these first,
#               with no heading, on the highlight tint.
#   page        a generated page, built by its own script
#   source      a markdown page, built like a deck
#
# [[deck]]
#   source      the deck's markdown file
#   player      "xero" or "fox". Each of us sleeves one deck at a time, so the
#               pull list takes the largest ask on each side and adds the two.
#   shelf       "league" for the two decks we are sleeving now. These are the
#               only titles that carry our names, and they share the library's
#               tint. "other" for everything else, whose titles drop the name.
#   group       the subheading an "other" deck is filed under
#   draft       true keeps a deck off the site entirely: no page, no front-page
#               row, and the pull list names it without a link. Delete the line
#               to publish.
#
# Both tables take:
#   sprites     the animated sprites beside the front-page row
#   mascot      the sprites beside the page's own title, when not the same
#   blurb       the front-page description. Line breaks are only for reading.
#   [*.flavor]  corner sprites for headings, keyed by the exact heading text.
#               A reworded heading orphans its key, and the build names it.
#
# Sprites load from assets/sprites/. The full library is in assets/ani/;
# promote one by copying it over. Gen 9 is absent from it.

[[library]]
page = "collection.html"
sprites = ["pokedex", "pokeball"]
blurb = """
A searchable collection of our combined binders. Every card, stat, and
ability, and whether it's legal for tournament play."""

[[library]]
page = "wishlist.html"
sprites = ["deck"]
blurb = """
Every card we still have to buy, the decks that want it, and how many copies
to pull. A card lands here when it is marked as not owned."""

[[library]]
source = "rules.md"
sprites = ["gengar-hop", "cursed"]
blurb = """
The table rulebook: every game word the deck pages lean on, how a game
actually runs, what the letters on the cards mean, and what a real
tournament expects."""

# the rules lawyers: the fake tree and the wall that just sits there.
[library.flavor]
"The board" = ["sudowoodo"]
"Rules that trip people up" = ["wobbuffet"]
"The big-card words" = ["gengar-mega"]
"How a Game Runs" = ["hoothoot"]
"Special Conditions" = ["drowzee"]
"Standard Legal, and Why Some Decks Aren't" = ["charizard"]
"Tournament Night" = ["noctowl"]
"How To Play ex Style" = ["gengar-mega-shiny"]
"7. Errors to expect on the way over" = ["eevee-back"]

